  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: ./react-frontend/package-lock.json

      - name: Install Dependencies & Build
        working-directory: ./react-frontend
        run: npm install

      - name: Build Frontend
        working-directory: ./react-frontend
        run: CI=false npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ./react-frontend/build
  
      - name: Save RDS Endpoint as Environment Variable
        run: echo "${{ needs.call-database-creation.outputs.rds_endpoint }}" > rds-endpoint.txt
            
      - name: Upload RDS endpoint
        uses: actions/upload-artifact@v4
        with:
          name: rds-endpoint
          path: rds-endpoint.txt

      - name: Export RDS Endpoint for Next Workflow
        run: echo "rds_endpoint=${{ needs.call-database-creation.outputs.rds_endpoint }}" >> $GITHUB_OUTPUT

