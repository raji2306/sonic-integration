name: Springboot-React CI/CD
run-name: Hexaware-Sonic-Run

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions: write-all

env:
  BACKEND_IMAGE: spring-image
  FRONTEND_IMAGE: react-image
  MYSQL_ROOT_PASSWORD: raji123*
  MYSQL_DATABASE: devops


jobs:
  call-database-creation:
    name: Create RDS Database
    uses: ./.github/workflows/Database_creation.yaml
    secrets:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      rds-username: ${{ secrets.RDS_USERNAME }}
      rds-password: ${{ secrets.RDS_PASSWORD }}
    
  debug-rds-endpoint:
      needs: call-database-creation
      runs-on: ubuntu-latest
      outputs:
        result: ${{ steps.set-output-step.outputs.rds_endpoint }}
      steps:
        - name: Set Output
          id: set-output-step
          run: echo "rds_endpoint=${{ needs.call-database-creation.outputs.rds_endpoint }}" >> $GITHUB_OUTPUT
        
