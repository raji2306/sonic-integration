name: Deploy SonarQube EC2

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose action: install or delete'
        required: true
        default: 'install'
        type: choice
        options:
          - install
          - delete

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      TF_VAR_pem_private_key_path: ${{ secrets.PEM_PRIVATE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        working-directory: terraform/sonarqube
        run: terraform init

      - name: Terraform Apply (Install)
        if: ${{ github.event.inputs.action == 'install' }}
        working-directory: terraform/sonarqube
        run: terraform apply -auto-approve

      - name: Terraform Destroy (Delete)
        if: ${{ github.event.inputs.action == 'delete' }}
        working-directory: terraform/sonarqube
        run: terraform destroy -auto-approve
