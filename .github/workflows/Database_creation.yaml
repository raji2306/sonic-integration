name: Deploy RDS

on:
  workflow_call:
    outputs:
      rds_endpoint:
        description: "RDS endpoint"
        value: ${{ jobs.terraform.outputs.rds_endpoint }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    outputs:
      rds_endpoint: ${{ steps.output_rds.outputs.endpoint }}
    
    defaults:
      run:
        working-directory: terraform
        
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.4

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        env:
          TF_VAR_db_username: ${{ secrets.RDS_USERNAME }}
          TF_VAR_db_password: ${{ secrets.RDS_PASSWORD }}
        run: terraform apply -auto-approve

      - name: Show Outputs
        run: terraform output      
        
      - name: Output RDS Endpoint
        id: output_rds
        run: |
          echo "endpoint=$(terraform output -raw rds_endpoint)" >> $GITHUB_OUTPUT

