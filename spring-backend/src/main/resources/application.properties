# Allow all CORS origins
cors.origin=*

# Database Configuration
spring.datasource.url=jdbc:mysql://devops.cfwus0g4m3bn.ap-south-1.rds.amazonaws.com:3306/devops
spring.datasource.username=admin
spring.datasource.password=admin123*

# Hibernate & JPA Settings
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Metrics & Actuator Configuration
management.metrics.enable.all=false
management.metrics.binders.processor.enabled=false
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.server.port=8080
management.endpoints.web.base-path=/actuator

# Optional: reduce logging for Prometheus scraping
logging.level.io.micrometer=INFO
logging.level.org.springframework.boot.actuate=INFO
