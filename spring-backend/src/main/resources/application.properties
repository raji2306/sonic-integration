cors.origin=*

# 🧪 Optional Profile Activation
# spring.profiles.active=test

# 🛢️ Database Configuration
spring.datasource.url=jdbc:mysql://devops.cfwus0g4m3bn.ap-south-1.rds.amazonaws.com:3306/devops
spring.datasource.username=admin
spring.datasource.password=admin123*

# 🧠 Hibernate & JPA Settings
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 📊 Metrics & Actuator Configuration
management.metrics.enable.all=false
management.metrics.binders.processor.enabled=false  # ✅ Prevents cgroup-related crash
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.server.port=8080

# Expose Prometheus endpoint
management.endpoints.web.exposure.include=prometheus,health,info
management.endpoint.prometheus.enabled=true

# Optional: base path for all actuator endpoints
management.endpoints.web.base-path=/actuator
